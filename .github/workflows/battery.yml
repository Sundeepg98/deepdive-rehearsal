name: Battery (offloaded soak / stability runs)

# Free parallel compute for the batteries that used to eat the local box:
# soak a single check N times, or run repeated full gates, sharded across runners.
# Dispatch:  gh workflow run battery.yml -f check=touch_floor -f runs_per_shard=6 -f runner=windows-latest
# Results:   per-shard artifacts + an aggregate line in the run summary.
# PLATFORM: runner is an input. windows-latest IS win32 -- the platform of
# record's rates can be soaked here at scale (a runner is still not the
# operator's exact box: fonts/GPU rasterization can differ, so VR-baseline
# reds are render-delta data, not instant defects). ubuntu = fastest setup,
# macos = the WebKit-adjacent host (concurrency cap 5). What genuinely stays
# local: VR byte-baselines, absolute perf calibration, NVDA.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'branch or sha to test'
        default: 'master'
        required: true
      check:
        description: 'check name for --only (ignored in fullgate mode)'
        default: 'touch_floor'
        required: true
      runs_per_shard:
        description: 'iterations per shard (5 shards total)'
        default: '6'
        required: true
      mode:
        description: 'solo = --only <check>; fullgate = whole serial gate each run'
        default: 'solo'
        required: true
      runner:
        description: 'runner platform'
        type: choice
        default: 'ubuntu-latest'
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  shard:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/AppData/Local/npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Logs live in the runner temp dir -- a workspace _battery/ made
      # build_integrity (rightly) refuse fullgate runs on a dirty tree.
      - name: Run the battery shard
        run: |
          B="$RUNNER_TEMP/_battery"
          mkdir -p "$B"
          PASS=0; FAIL=0
          for i in $(seq 1 ${{ inputs.runs_per_shard }}); do
            if [ "${{ inputs.mode }}" = "fullgate" ]; then
              CMD="python test/check_all.py"
            else
              CMD="python test/check_all.py --only ${{ inputs.check }}"
            fi
            if $CMD > "$B/run_${{ matrix.shard }}_$i.log" 2>&1; then
              PASS=$((PASS+1))
            else
              FAIL=$((FAIL+1))
              grep -E "FAIL|Error" "$B/run_${{ matrix.shard }}_$i.log" | head -5 > "$B/fail_${{ matrix.shard }}_$i.txt" || true
            fi
          done
          echo "{\"shard\": ${{ matrix.shard }}, \"pass\": $PASS, \"fail\": $FAIL}" > "$B/shard_${{ matrix.shard }}.json"
          echo "shard ${{ matrix.shard }}: $PASS pass / $FAIL fail"

      - uses: actions/upload-artifact@v4
        with:
          name: battery-${{ inputs.check }}-${{ inputs.runner }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/_battery/

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _all

      - name: Aggregate
        run: |
          TOTAL_PASS=0; TOTAL_FAIL=0
          for f in _all/*/shard_*.json; do
            P=$(python3 -c "import json;print(json.load(open('$f'))['pass'])")
            F=$(python3 -c "import json;print(json.load(open('$f'))['fail'])")
            TOTAL_PASS=$((TOTAL_PASS+P)); TOTAL_FAIL=$((TOTAL_FAIL+F))
          done
          N=$((TOTAL_PASS+TOTAL_FAIL))
          echo "## Battery: ${{ inputs.check }} (${{ inputs.mode }}) @ ${{ inputs.ref }} on ${{ inputs.runner }}" >> $GITHUB_STEP_SUMMARY
          echo "**$TOTAL_FAIL fail / $N runs** (${{ inputs.runner }}; runner != the operator box for render-shaped checks)" >> $GITHUB_STEP_SUMMARY
          ls _all/*/fail_*.txt 2>/dev/null && echo "failure signatures in shard artifacts" >> $GITHUB_STEP_SUMMARY || true
