name: Nightly gate (free continuous flake + regression telemetry)

# Three full serial gates on master every night while everyone sleeps.
# Cost: zero (public repo). Yield: a standing time series of gate health on
# ubuntu -- regressions and emergent flakes surface in the morning summary
# instead of mid-wave. Platform caveat as always: ubuntu telemetry complements
# the local win32 capture of record.

on:
  schedule:
    - cron: '30 21 * * *'   # 03:00 IST nightly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Full serial gate (run ${{ matrix.run }})
        run: python test/check_all.py 2>&1 | tee gate_${{ matrix.run }}.log
      - name: Preserve log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fail-run${{ matrix.run }}
          path: gate_${{ matrix.run }}.log
